<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">USB-Stick über einen OTG-Adapter mit dem Smartphone verbinden</title>
  <desc id="desc">Ein Android-Smartphone mit USB-C wird über einen datenfähigen USB-C-OTG-Adapter mit einem normalen USB-A-Stick verbunden.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="28" fill="#f7faff"/>

  <!-- Smartphone -->
  <g>
    <rect x="72" y="50" width="206" height="286" rx="28" fill="#ffffff" stroke="#0b3a78" stroke-width="4"/>
    <rect x="91" y="79" width="168" height="218" rx="15" fill="#eaf3ff"/>
    <circle cx="175" cy="66" r="5" fill="#526379"/>
    <rect x="156" y="322" width="38" height="8" rx="4" fill="#07111f"/>
    <text x="175" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#07111f">Android-Handy</text>
    <text x="175" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#526379">USB-C-Anschluss</text>
  </g>

  <!-- Cable and OTG adapter -->
  <path d="M175 330 C175 365 300 358 330 286" fill="none" stroke="#0b3a78" stroke-width="9" stroke-linecap="round"/>
  <g>
    <rect x="319" y="245" width="48" height="70" rx="12" fill="#dcecff" stroke="#0f5ebd" stroke-width="3"/>
    <rect x="332" y="227" width="22" height="24" rx="7" fill="#b9c4d2" stroke="#526379" stroke-width="2"/>
    <rect x="367" y="225" width="218" height="105" rx="23" fill="#ffffff" stroke="#0f5ebd" stroke-width="4"/>
    <rect x="535" y="249" width="35" height="57" rx="5" fill="#07111f"/>
    <rect x="541" y="256" width="23" height="45" rx="3" fill="#dcecff"/>
    <text x="476" y="266" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#0b3a78">OTG</text>
    <text x="476" y="291" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700" fill="#187b4e">Datenfähig</text>
    <text x="452" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#07111f">USB-C-OTG-Adapter</text>
    <text x="452" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#526379">USB-C auf USB-A</text>
  </g>

  <!-- USB stick -->
  <g>
    <rect x="620" y="249" width="82" height="57" rx="5" fill="#c5ceda" stroke="#526379" stroke-width="3"/>
    <rect x="632" y="258" width="14" height="39" rx="2" fill="#ffffff"/>
    <rect x="657" y="258" width="14" height="39" rx="2" fill="#ffffff"/>
    <rect x="694" y="222" width="190" height="111" rx="25" fill="#0b3a78"/>
    <circle cx="847" cy="277" r="13" fill="#eaf3ff"/>
    <path d="M735 277h69" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M785 259l19 18-19 18" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="777" y="375" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#07111f">normaler USB-Stick</text>
    <text x="777" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#526379">USB-A-Stecker</text>
  </g>

  <path d="M592 277H615" fill="none" stroke="#187b4e" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
